name: CI

on:
  push:
    branches: [main, 'chore/visual-docs-*']
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      # System media binaries so the backend + research-paper tests run for real
      # (ffmpeg/ffprobe for render+verify, poppler for the paper subsystem). The
      # Kokoro neural-voice tests skip automatically — the tts extra is not
      # installed here, so kokoro-onnx is absent.
      - name: Install media binaries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils

      # Matched upstream Pandoc/crossref binaries: execute the manuscript gates
      # rather than accidentally losing core coverage through missing tools.
      # Digests are the upstream GitHub release asset SHA-256 values.
      - name: Install manuscript check tools
        run: |
          mkdir -p output/ci-tools/bin
          curl --fail --location --silent --show-error \
            https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz \
            --output output/ci-tools/pandoc.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.26a/pandoc-crossref-Linux-X64.tar.xz \
            --output output/ci-tools/pandoc-crossref.tar.xz
          printf '%s\n' \
            '38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  output/ci-tools/pandoc.tar.gz' \
            'e61fc62485bd432c0662c2508eb40a9e501d0f47a90736995793ad73e3c0c017  output/ci-tools/pandoc-crossref.tar.xz' \
            | sha256sum --check
          tar -xzf output/ci-tools/pandoc.tar.gz --strip-components=2 \
            --directory output/ci-tools/bin pandoc-3.13/bin/pandoc
          tar -xJf output/ci-tools/pandoc-crossref.tar.xz \
            --directory output/ci-tools/bin pandoc-crossref
          echo "$GITHUB_WORKSPACE/output/ci-tools/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # astral-sh/setup-uv@v10.3.3

      - name: Install package (core + dev)
        run: uv pip install --system -e ".[dev]"

      - name: Core-only import preflight
        run: python scripts/00_preflight.py

      - name: Build and exercise installed wheel
        run: |
          uv build --python ${{ matrix.python-version }} --out-dir output/dist
          uv venv --python ${{ matrix.python-version }} output/package-smoke
          uv pip install --python output/package-smoke/bin/python output/dist/*.whl
          cd output/package-smoke
          bin/python -c "from importlib.resources import files; from democreate import Demo, Scene, Chunk, Workspace, build_demo; assert files('democreate').joinpath('export/templates/player.html.j2').is_file(); result = build_demo(Demo(title='Installed wheel', scenes=[Scene(id='s', chunks=[Chunk(id='c', text='Installed package rendering works.')])], width=320, height=180), Workspace('smoke-output')); assert result.player_path.is_file()"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Focused capture localization and API regressions
        run: python -m pytest -q --no-cov tests/capture/ tests/translation/ tests/test_api_docs.py

      # Full suite incl. the ≥90% coverage gate and the output-public-allowlist
      # gate (which fails if anything other than the self-descriptor bundle is
      # tracked under output/).
      - name: Test + coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=json:output/coverage.json

  visual-docs:
    name: docs / figures / manuscript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install native rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils texlive-xetex texlive-latex-extra texlive-science texlive-fonts-recommended
          uv pip install --system -e .
      - name: Install matched manuscript tools
        run: |
          mkdir -p output/ci-tools/bin
          curl --fail --location --silent --show-error \
            https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz \
            --output output/ci-tools/pandoc.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/lierdakil/pandoc-crossref/releases/download/v0.3.26a/pandoc-crossref-Linux-X64.tar.xz \
            --output output/ci-tools/pandoc-crossref.tar.xz
          printf '%s\n' \
            '38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389  output/ci-tools/pandoc.tar.gz' \
            'e61fc62485bd432c0662c2508eb40a9e501d0f47a90736995793ad73e3c0c017  output/ci-tools/pandoc-crossref.tar.xz' \
            | sha256sum --check
          tar -xzf output/ci-tools/pandoc.tar.gz --strip-components=2 \
            --directory output/ci-tools/bin pandoc-3.13/bin/pandoc
          tar -xJf output/ci-tools/pandoc-crossref.tar.xz \
            --directory output/ci-tools/bin pandoc-crossref
          echo "$GITHUB_WORKSPACE/output/ci-tools/bin" >> "$GITHUB_PATH"
      - name: Regenerate source-owned visualizations and API
        id: generate_visuals
        run: |
          python docs/manuscript/figures/make_figures.py
          python docs/manuscript/figures/graphical_abstract.py
          python docs/_gallery/make_gallery.py
          python scripts/generate_api_docs.py
      - name: Exercise localized media API with an explicit silent control
        id: localization_smoke
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, wave
          from democreate.config import RenderConfig
          from democreate.project_paths import Workspace
          from democreate.schema import Chunk, Demo, Scene
          from democreate.translation.localize import localize_render
          from democreate.translation.translator import IdentityTranslator, LanguageConfig
          root = pathlib.Path("output/ci-visual")
          workspace = Workspace(root / "localization")
          config = RenderConfig()
          config.audio.lead_silence_ms = 125
          config.audio.trail_silence_ms = 200
          config.audio.normalize = False
          config.video.animation_fps = 5
          config.video.preset = "ultrafast"
          demo = Demo(title="Silent timing control", width=320, height=180, scenes=[Scene(id="control", chunks=[Chunk(id="clip", text="This is a silent timing control.", start_ms=9000, duration_ms=1)])])
          result = localize_render(demo, workspace, languages=LanguageConfig("en", "en", "en"), translator=IdentityTranslator(), tts="silent", config=config, verify=False)
          assert result.video_path is not None and result.video_path.is_file(), result.error
          probe = subprocess.run(["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(result.video_path)], stdin=subprocess.DEVNULL, capture_output=True, text=True, check=True)
          subprocess.run(["ffmpeg", "-v", "error", "-ss", "0.8", "-i", str(result.video_path), "-frames:v", "1", str(root / "localization-frame.png")], stdin=subprocess.DEVNULL, check=True)
          with wave.open(str(workspace.audio / "chunk_0000.wav"), "rb") as audio:
              clip_ms = round(audio.getnframes() * 1000 / audio.getframerate())
          receipt = {"control": "silent; not canonical voiced media or acoustic-accuracy evidence", "lead_ms": 125, "measured_clip_ms": clip_ms, "result": result.to_dict(), "srt": result.subtitle_srt.read_text(), "vtt": result.subtitle_vtt.read_text(), "ffprobe": json.loads(probe.stdout)}
          (root / "localization-smoke.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          PY
      - name: Check and render manuscript
        id: render_manuscript
        run: |
          mkdir -p output/ci-visual/pages
          python scripts/build_manuscript.py --check -o output/ci-visual/manuscript.pdf
          python scripts/build_manuscript.py -o output/ci-visual/manuscript.pdf
          pdftoppm -scale-to 1200 -png output/ci-visual/manuscript.pdf output/ci-visual/pages/page
      - name: Require committed API and figures to match their generators
        id: generated_current
        run: |
          python - <<'PY'
          import subprocess
          paths = ["docs/api.md", "docs/manuscript/figures/*.png", "docs/_gallery/*.png"]
          state = subprocess.run(["git", "status", "--porcelain=v1", "--untracked-files=all", "--", *paths], stdin=subprocess.DEVNULL, capture_output=True, text=True, check=True)
          if state.stdout:
              print("Inspect retained artifacts and refresh generated files:\n" + state.stdout)
              raise SystemExit(1)
          PY
      - name: Bind retained artifacts to source and generation status
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.generate_visuals.outcome }}
          MANUSCRIPT_OUTCOME: ${{ steps.render_manuscript.outcome }}
          LOCALIZATION_OUTCOME: ${{ steps.localization_smoke.outcome }}
          GENERATED_CURRENT_OUTCOME: ${{ steps.generated_current.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          from PIL import __version__ as pillow_version, features
          root = pathlib.Path(".")
          files = sorted({p for pattern in ("docs/manuscript/figures/*.png", "docs/_gallery/*.png", "docs/api.md", "output/ci-visual/**/*") for p in root.glob(pattern) if p.is_file() and p != root / "output/ci-visual/manifest.json"})
          manifest = {"commit": os.environ["GITHUB_SHA"], "python": sys.version, "pillow": pillow_version, "freetype": features.version_module("freetype2"), "generation_outcome": os.environ["GENERATION_OUTCOME"], "localization_outcome": os.environ["LOCALIZATION_OUTCOME"], "manuscript_outcome": os.environ["MANUSCRIPT_OUTCOME"], "generated_current_outcome": os.environ["GENERATED_CURRENT_OUTCOME"], "files": [{"path": p.as_posix(), "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in files]}
          output = root / "output/ci-visual/manifest.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Retain inspectable visual proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-proof-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            docs/manuscript/figures/*.png
            docs/_gallery/*.png
            docs/api.md
            output/ci-visual/
