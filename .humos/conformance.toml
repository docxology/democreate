# Conformance contract for DemoCreate.

[conformance]
schema_version    = 1
runtime           = "python"
package_aliases   = ["democreate"]
cli_aliases       = ["democreate"]
gate_argv         = [".venv/bin/python", "-m", "pytest", "--cov", "--cov-report=term-missing", "-q"]
coverage_floor    = 90
required_surfaces = [
  "agents",
  "readme",
  "gitignore",
  "ci",
  "sidecar",
  "package_metadata",
  "source",
  "tests",
  "coverage",
  "docs",
]