# .humos/sidecar.toml - HumOS integration declaration for DemoCreate.
# Standalone coupling grants no humos.* runtime import surface.
# Core package dependencies are declared in pyproject.toml; standalone does not
# mean zero Python dependencies. Registration and dashboard consumption are
# declarations, not verified live integrations.

[sidecar]
schema_version = 1
project_id     = "democreate"
project_slug   = "democreate"
project_name   = "DemoCreate — Declarative AV Demo Generation"
archetype      = "project"
coupling       = "standalone"

[registry]
humos_root    = "../../../../../.."
auto_register = true

[project_meta]
owner    = "daniel"
status   = "active"
priority = "high"
tags     = ["video", "demo", "demo-generation", "tts", "codebase-tour", "audio-visual", "docxology"]
