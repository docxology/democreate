# Prospective protocol, not an executed experiment or release receipt.
title: "DemoCreate: Declarative Audio-Visual Demo Generation for Software"
version: "0.8.0"
domain: software_tooling
status: planned
schema_version: "1.1"
evidence_status: "No >=30-demo independently annotated voiced corpus or measured <=120 ms result is available."

goal: >-
  Evaluate visible-event/acoustic-word alignment of the default timing heuristic
  on voiced renders, separately from silent-default reproducibility and latency.
  Silent audio has no spoken-word onset; its acoustic error is undefined, never zero.

hypotheses:
  - id: H1
    statement: >-
      The default character-weighted timing heuristic, applied to eligible voiced
      animated renders, achieves both pooled event median and median of demo-level
      sync_error_ms medians <=120 across the independently annotated corpus.
      This is not a claim about acoustic onsets in the literal silent default.
  - id: H2
    statement: >-
      An implemented acoustic-alignment adapter reduces median sync_error_ms
      relative to the heuristic on the identical voiced WAVs. This comparison
      cannot run with the current unwired Whisper slot.
  - id: H3
    statement: >-
      Silent-default builds are byte-reproducible with identical authored input,
      assets, configuration and pinned runtime. Neural/native voice synthesis
      is not assumed byte-identical across versions or machines.

conditions:
  - id: default
    label: "Silent-default engineering control"
    acoustic_metric_eligible: false
    description: >-
      Silent WAVs, measured-duration word interpolation and synthetic frames.
      Tests deterministic output and engineering structure, not acoustic accuracy.
    backends:
      tts: silent
      stt: heuristic
      capture: synthetic
      animation: deterministic
      assembly: deterministic
  - id: voiced_heuristic
    label: "Voiced audio with the default timing heuristic"
    acoustic_metric_eligible: true
    description: >-
      Fix and report a system or implemented Kokoro voice, synthesize once, seal
      the WAVs and annotate actual word onsets independently. Render with
      animate=True and report frame cadence. Do not pool different engines or
      voices without separate strata. Static representative stills are ineligible
      for a within-chunk visible-event onset claim.
    backends:
      tts: pinned_system_or_kokoro
      stt: heuristic
      capture: synthetic
      animation: scheduled
      assembly: ffmpeg
  - id: high_fidelity
    label: "Future acoustic alignment on the same voiced audio"
    acoustic_metric_eligible: true
    runnable: false
    prerequisite: "A real implemented alignment adapter; installing Whisper alone is insufficient."
    description: >-
      Reuse the voiced_heuristic WAVs, transcript, actions and render settings;
      change only word alignment. Current guarded slots cannot produce results.

primary_metric:
  id: sync_error_ms
  description: >-
    Absolute difference in milliseconds between independently annotated acoustic
    trigger-word onset and the first visible effect of its intended action in the
    encoded video. Include configured lead/gaps in the shared timebase. Report
    per-event errors, each demo's median, then the median of demo medians so that
    long demos do not dominate. Missing speech, absent visible events, unmatched
    triggers and unavailable adapters are explicit failures/unavailable data,
    never zero-error samples or silently excluded successes.
  aggregation_guard: "Both pooled event median and median of demo medians must be <=120 ms; neither weighting may conceal failure."
  unit: milliseconds
  direction: minimize
  threshold: "pooled event median AND median of demo medians <=120"
  annotation_protocol: >-
    Annotators must not derive ground truth from HeuristicTranscriber or authored
    action timestamps. Identify events by scene/chunk ID and action index; retain
    audio/video SHA-256 identities, onset annotations, disagreement/adjudication
    records and frame cadence. Report annotation uncertainty and frame quantization.

secondary_metrics:
  - id: render_ms_per_output_s
    description: "Wall-clock render_video time per output second, with exact timed stages and raw samples."
    unit: ms_per_s
    direction: minimize
  - id: reproducibility_byte_diff
    description: "Byte differences between identified silent-default outputs under the same environment."
    unit: bytes
    direction: minimize
  - id: coverage_completeness
    description: "Fraction of declared intended visual events actually observed in encoded output; absent events remain failures."
    unit: fraction
    direction: maximize

corpus:
  status: planned
  description: "Independent voiced demos and annotations; no dataset is supplied by this plan."
  items: [codebase_tour, website_walkthrough, terminal_cli_demo]
  size: ">=30 demos (>=10 per mode)"
  controls: >-
    Predeclare texts, intended trigger occurrences, actions, assets, voices and
    versions before scoring. Include repeated words, short/long chunks, silence
    gaps and file/scene transitions. Website synthetic-state and real-browser
    recordings are separate strata, not interchangeable evidence.

expected_figures:
  - sync_error_distribution
  - pipeline_latency_breakdown
  - action_narration_timeline
  - backend_fidelity_matrix
expected_tables:
  - id: T1
    caption: "Median and p90 error by eligible condition, voice and demo mode; report missing/failed events."
  - id: T2
    caption: "Wall-clock latency with stage boundaries, raw samples and runtime/source identities."
  - id: T3
    caption: "Silent-default byte differences and observed-event completeness."

baselines:
  - id: B0
    name: "Chunk-start anchoring"
    description: "Reuse sealed voiced audio; place visual actions at their chunk start rather than interpolated word offsets."
  - id: B1
    name: "Capture-only architectural reference"
    description: "asciinema/termtosvg are not acoustic-error baselines without equivalent narrated stimuli; no unsupported numeric comparison."
ablations:
  - id: A1
    name: "Uniform instead of character-weighted word interpolation"
    description: "Proposed timing-only variant on identical WAVs; no claim that a no-STT ablation differs from the current heuristic."
  - id: A2
    name: "No chunk boundaries"
    description: "Proposed timing variant on the same concatenated voiced audio; do not resynthesize text and confound alignment with changed speech."
  - id: A3
    name: "Static versus scheduled animated rendering"
    description: "Hold audio/configuration fixed; static stills are a visual-timing negative control, not proof of within-chunk alignment."
  - id: A4
    name: "Synthetic versus real capture"
    description: "Future workflow-specific comparison; requires identified captured inputs and implemented integration, not merely an installed driver."

success_criteria:
  - "H1: pooled event median AND median of demo-level voiced sync_error_ms medians <=120 on >=30 independently annotated demos."
  - "H2: implemented acoustic alignment improves or matches heuristic timing on identical audio; currently unavailable."
  - "H3: identified silent-default outputs have zero byte differences under pinned inputs/runtime."
  - "Configured >=90% core coverage passes for the analyzed source."
  - "No corpus, acoustic result or release-readiness claim from synthetic timestamp structure alone."
