# Engineering acceptance declarations; a command is not a passing receipt.
domain: software_tooling
version: "0.8.0"
schema_version: "1.1"
summary: >-
  Declarative demo generation with measured clip durations and heuristic word
  interpolation. System/Kokoro voices and ffmpeg are optional implemented paths;
  Whisper, Chatterbox and Manim are unwired slots.
outputs:
  required: [frames, captions, html, wav]
  preferred: [mp4, gif]
validation_gates:
  - id: coverage_core
    description: "Run the real-filesystem suite with the configured core coverage floor."
    check: ".venv/bin/python -m pytest --cov=democreate --cov-report=term-missing"
    threshold: ">=90% coverage, as configured in pyproject.toml"
    blocking: true
  - id: deterministic_default
    description: "Build a self-contained starter with silent TTS and core dependencies."
    check: "mkdir -p output/gates && democreate init output/gates/starter.json && democreate build output/gates/starter.json -o output/gates/run_a --tts silent"
    threshold: "exit 0; inspect frames, captions and web/player.html"
    blocking: true
  - id: byte_reproducible
    description: "Compare two default-run manifests from the same starter and environment."
    prerequisite: deterministic_default
    check: "democreate build output/gates/starter.json -o output/gates/run_b --tts silent && diff output/gates/run_a/manifests/render_manifest.json output/gates/run_b/manifests/render_manifest.json"
    threshold: "0 byte difference"
    blocking: true
  - id: schema_valid
    description: "Inspect all shipped schema-1.1 examples without claiming their external assets exist."
    check: "democreate inspect examples/democreate_intro.json && democreate inspect examples/democreate_showcase.json && democreate inspect examples/democreate_paper_showcase.json"
    threshold: "0 structural validation errors"
    blocking: true
  - id: sync_accuracy
    description: "Independent visible-event/acoustic onset error on voiced animated demos; silent WAVs have no acoustic onsets."
    status: pending_unmet
    check: null
    prerequisite: "Independent annotated >=30-demo voiced corpus and acoustic/video onset evaluator are not implemented/available."
    threshold: "pooled event median AND median of demo-level sync_error_ms medians <=120"
    blocking: true
  - id: sync_structure
    description: "Exercise heuristic timing structure, not acoustic accuracy."
    check: ".venv/bin/python -m pytest tests/narration/test_sync.py -q --no-cov"
    threshold: "exit 0; does not establish 120 ms accuracy"
    blocking: true
  - id: manuscript_assets
    description: "Check citations, figure paths and insertions with the manuscript toolchain installed."
    check: ".venv/bin/python scripts/build_manuscript.py --check"
    threshold: "exit 0; Pandoc and pandoc-crossref required"
    blocking: true
  - id: backend_contract
    description: "Run optional integration checks only with their declared prerequisites."
    check: ".venv/bin/python -m pytest -m backend -q --no-cov"
    threshold: "record passed, skipped and unavailable separately"
    blocking: false
  - id: canonical_media
    description: "Render the actual Kokoro af_heart package showcase at 2160p and verify media presence."
    prerequisite: "Compatible repository-local TTS environment; explicit KOKORO_MODEL_PATH, KOKORO_VOICES_PATH and DEMOCREATE_KOKORO_DIR point at output/wfz/models, XDG_CACHE_HOME is repository-local; core remains Python 3.15."
    check: "output/wfz/voice-env/bin/python -m democreate.cli render examples/democreate_showcase.json -o output/gates/canonical --tts kokoro --voice af_heart --resolution 2160p && output/wfz/voice-env/bin/python -m democreate.cli verify output/gates/canonical/video/demo.mp4 --width 3840 --height 2160"
    threshold: "real H.264/AAC, expected geometry, non-silent/non-black; no intelligibility or acoustic-accuracy inference"
    blocking: true
  - id: source_bound_starter_benchmark
    description: "Observe one synthetic silent starter with raw samples and source/input/runtime bindings."
    check: ".venv/bin/python scripts/benchmark.py --output output/gates/benchmarks-0.8.0.json"
    threshold: "successful observed run with raw samples, explicit timing boundaries and probed encoded duration; no corpus or improvement claim"
    blocking: false
empirical_study:
  status: planned
  plan: experiment_plan.yaml
  metric: sync_error_ms
  hypothesis: "pooled event median AND median of demo-level error medians <=120 ms on >=30 independently annotated voiced demos"
  blocking_release: true
  gate: sync_accuracy
  missing: "Annotated voiced corpus, acoustic/video evaluator, condition/baseline/ablation results."
figure_types:
  - id: sync_error_distribution
    status: planned
  - id: pipeline_latency_breakdown
    status: planned
  - id: action_narration_timeline
    status: illustrative
  - id: backend_fidelity_matrix
    status: planned
benchmark_rubric:
  dimensions: [synchronization, determinism, narration_quality, visual_fidelity, coverage_completeness, latency, portability]

# sync_accuracy remains a blocking legacy acceptance criterion. Its former
# pytest recipe never measured acoustic error; no replacement evaluator or
# passing receipt is invented. Candidate release/readiness remains blocked.
